name: build
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Install Gradle
      run: |
        wget -q https://mirrors.cloud.tencent.com/gradle/gradle-8.5-bin.zip
        unzip -q gradle-8.5-bin.zip -d $HOME/gradle
        echo "$HOME/gradle/gradle-8.5/bin" >> $GITHUB_PATH
    - name: Build
      run: gradle -p . assembleDebug --no-daemon --stacktrace
    - uses: actions/upload-artifact@v4
      with:
        name: cargestures-apk
        path: app/build/outputs/apk/debug/*.apk
